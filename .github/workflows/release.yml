name: release

# Builds the Windows executable and attaches it to a GitHub Release, so a new
# version is a download rather than a local build.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Or run it by hand from the Actions tab to get the .exe as an artifact
# without publishing a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check the tests pass before shipping anything
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build the executable
        run: python build_exe.py

      - name: Keep the build even when there is no tag
        uses: actions/upload-artifact@v7
        with:
          name: IGprepper-windows
          path: dist/IGprepper.exe
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              dist/IGprepper.exe --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" \
              dist/IGprepper.exe --clobber
