name: phone

# Builds the Android test app and publishes it as a pre-release, so it can be
# downloaded straight onto the phone.
#
#   git tag phone-1 && git push origin phone-1
#
# The number after "phone-" becomes the app version, so each tag must be higher
# than the last or Android will refuse the update.
#
# Run by hand from the Actions tab, it builds without publishing and keeps the
# result as an artifact.

on:
  push:
    tags: ['phone-*']
  workflow_dispatch:

permissions:
  contents: write  # needed to create the pre-release

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Briefcase
        run: pip install briefcase==0.4.5

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/phone-')
        run: |
          number="${GITHUB_REF_NAME#phone-}"
          case "$number" in
            ''|*[!0-9]*) echo "Tag must look like phone-12, got $GITHUB_REF_NAME"; exit 1 ;;
          esac
          sed -i "s/^version = .*/version = \"0.0.$number\"/" phone/pyproject.toml
          grep '^version' phone/pyproject.toml

      - name: Build the app
        working-directory: phone
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          briefcase create android --no-input
          briefcase build android --no-input
          briefcase package android -p apk --no-input
          find . -name '*.apk' -printf '%p  %s bytes\n'

      - name: Sign it
        id: sign
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          set -euo pipefail
          unsigned="$(find phone/dist phone/build -name '*.apk' | head -1)"
          test -n "$unsigned" || { echo "No APK was produced"; exit 1; }

          if [ -z "${ANDROID_SIGNING_KEY:-}" ]; then
            echo "No signing key is configured, so this build cannot be installed."
            cp "$unsigned" IGprepper-unsigned.apk
            echo "apk=IGprepper-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest build tools from whichever Android SDK the build used.
          apksigner="$(find "${ANDROID_HOME:-/nonexistent}" "$HOME/.cache/briefcase" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          tools="$(dirname "$apksigner")"

          umask 077
          keys="$(mktemp -d)"
          trap 'rm -rf "$keys"' EXIT
          # Tolerate a byte-order mark or Windows line endings picked up when
          # the key was uploaded; either would hide the key from openssl.
          printf '%s\n' "$ANDROID_SIGNING_KEY" \
            | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r' > "$keys/all.pem"
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
            -in "$keys/all.pem" -out "$keys/key.pk8" \
            || { echo "The signing key secret does not contain a usable private key"; exit 1; }
          openssl x509 -in "$keys/all.pem" -out "$keys/cert.pem" \
            || { echo "The signing key secret does not contain a certificate"; exit 1; }

          name="IGprepper-${GITHUB_REF_NAME//\//-}.apk"
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --key "$keys/key.pk8" --cert "$keys/cert.pem" \
            --out "$name" aligned.apk
          "$tools/apksigner" verify --print-certs "$name" | grep -E 'DN|SHA-256'
          echo "apk=$name" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: IGprepper-android
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error

      - name: Publish it as a pre-release
        if: startsWith(github.ref, 'refs/tags/phone-') && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.sign.outputs.apk }}" \
            --prerelease \
            --title "Phone test build ${GITHUB_REF_NAME#phone-}" \
            --notes "Android test build. Not for general use." \
            || gh release upload "$GITHUB_REF_NAME" "${{ steps.sign.outputs.apk }}" --clobber
