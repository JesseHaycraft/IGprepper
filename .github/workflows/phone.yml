name: phone

# Builds the Android app and publishes it as a pre-release, so it can be
# downloaded straight onto the phone.
#
#   git tag phone-1 && git push origin phone-1
#
# The number after "phone-" becomes the app version, so each tag must be higher
# than the last or Android will refuse the update.
#
# Run by hand from the Actions tab, it builds without publishing and keeps the
# result as an artifact.

on:
  push:
    tags: ['phone-*']
  workflow_dispatch:

permissions:
  contents: write  # needed to create the pre-release

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Briefcase
        run: pip install briefcase==0.4.5

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/phone-')
        run: |
          number="${GITHUB_REF_NAME#phone-}"
          case "$number" in
            ''|*[!0-9]*) echo "Tag must look like phone-12, got $GITHUB_REF_NAME"; exit 1 ;;
          esac
          sed -i "s/^version = .*/version = \"0.0.$number\"/" phone/pyproject.toml
          grep '^version' phone/pyproject.toml

      - name: Build the app
        working-directory: phone
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          briefcase create android --no-input
          briefcase build android --no-input
          briefcase package android -p apk --no-input
          find . -name '*.apk' -printf '%p  %s bytes\n'

      - name: Sign it
        id: sign
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          set -euo pipefail
          unsigned="$(find phone/dist phone/build -name '*.apk' | head -1)"
          test -n "$unsigned" || { echo "No APK was produced"; exit 1; }

          if [ -z "${ANDROID_SIGNING_KEY:-}" ]; then
            echo "No signing key is configured, so this build cannot be installed."
            cp "$unsigned" IGprepper-unsigned.apk
            echo "apk=IGprepper-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest build tools from whichever Android SDK the build used.
          apksigner="$(find "${ANDROID_HOME:-/nonexistent}" "$HOME/.cache/briefcase" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          tools="$(dirname "$apksigner")"

          umask 077
          keys="$(mktemp -d)"
          trap 'rm -rf "$keys"' EXIT
          # Tolerate a byte-order mark or Windows line endings picked up when
          # the key was uploaded; either would hide the key from openssl.
          printf '%s\n' "$ANDROID_SIGNING_KEY" \
            | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r' > "$keys/all.pem"
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
            -in "$keys/all.pem" -out "$keys/key.pk8" \
            || { echo "The signing key secret does not contain a usable private key"; exit 1; }
          openssl x509 -in "$keys/all.pem" -out "$keys/cert.pem" \
            || { echo "The signing key secret does not contain a certificate"; exit 1; }

          name="IGprepper-${GITHUB_REF_NAME//\//-}.apk"
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --key "$keys/key.pk8" --cert "$keys/cert.pem" \
            --out "$name" aligned.apk
          "$tools/apksigner" verify --print-certs "$name" | grep -E 'DN|SHA-256'
          echo "apk=$name" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Check the build carries no account name
        # Builds are public. The package id and the certificate are kept free
        # of personal names, and project metadata must not quietly put one
        # back -- so search the whole file, including the archives inside it.
        env:
          APK: ${{ steps.sign.outputs.apk }}
        run: |
          python - <<'PY'
          import io, os, sys, zipfile

          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower().encode()
          found = []

          def scan(data, where, depth=0):
              if owner in data.lower():
                  found.append(where)
              if data[:2] == b"PK" and depth < 3:
                  try:
                      inner = zipfile.ZipFile(io.BytesIO(data))
                  except zipfile.BadZipFile:
                      return
                  for name in inner.namelist():
                      scan(inner.read(name), f"{where} -> {name}", depth + 1)

          with open(os.environ["APK"], "rb") as fh:
              scan(fh.read(), os.environ["APK"])
          # The outer file always "contains" whatever its members contain.
          found = [f for f in found if " -> " in f] or found
          if found:
              print("The account name appears inside the build:")
              print("\n".join(f"  {f}" for f in found))
              sys.exit(1)
          print("No account name anywhere in the build.")
          PY

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app in an emulator
        # Nobody can see the phone's own logs, so a build that crashes on
        # launch would cost a whole round trip and explain nothing. This runs
        # the app in an emulator and has it test itself before anything is
        # published: the image checks, and every folder and file operation
        # against the emulator's own storage.
        env:
          APK: ${{ steps.sign.outputs.apk }}
          SIGNED: ${{ steps.sign.outputs.signed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          adb="$ANDROID_HOME/platform-tools/adb"
          package=org.igprepper.igprepper
          activity="$package/org.beeware.android.MainActivity"
          logs='/sdcard/Download/IGprepper/*.txt'

          count_logs() {
            "$adb" shell "ls $logs 2>/dev/null | wc -l" 2>/dev/null | tr -dc '0-9'
          }
          wait_for_logs() {   # $1 = how many log files, $2 = seconds allowed
            local deadline=$((SECONDS + $2))
            until [ "$(count_logs)" -ge "$1" ] 2>/dev/null; do
              [ $SECONDS -lt $deadline ] || return 1
              # A crash will never produce a log; stop waiting for one.
              if "$adb" logcat -d -s AndroidRuntime:E 2>/dev/null | grep -q "$package"; then
                echo "The app crashed."
                return 1
              fi
              sleep 10
            done
            sleep 15   # let the app finish its opening report
          }
          show_crash() {
            "$adb" logcat -d 2>/dev/null \
              | grep -iE "python|igprepper|FATAL|AndroidRuntime" | tail -120
          }

          # Briefcase creates and boots the emulator, installs the debug build
          # and starts it, then follows the app's output until it is stopped.
          (cd phone && briefcase run android --no-input \
              --device '{"avd":"beePhone","device_type":"pixel"}' \
              --Xemulator=-no-window --Xemulator=-no-snapshot \
              --Xemulator=-no-audio --Xemulator=-no-boot-anim \
              > ../emulator-run.log 2>&1) &

          if ! wait_for_logs 1 900; then
            echo "The app never wrote a log file. Last output from the run:"
            tail -80 emulator-run.log
            show_crash
            exit 1
          fi
          pkill -f "briefcase run" || true
          "$adb" shell am force-stop "$package"

          if [ "$SIGNED" = "true" ]; then
            # From here on, test the file that will actually be published.
            "$adb" uninstall "$package" >/dev/null

            # If an earlier build was published, install that first and then
            # this one over it: the update a phone will actually perform. It
            # fails if the signature has changed or the version went backwards.
            previous="$(gh release list --limit 30 --json tagName \
              --jq '[.[].tagName | select(startswith("phone-"))][0] // empty')"
            # Only on a tagged build: an untagged trial has no version number
            # of its own, and Android would rightly reject it as a downgrade.
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -n "$previous" ]                 && [ "$previous" != "$GITHUB_REF_NAME" ]; then
              mkdir -p previous-build
              gh release download "$previous" --dir previous-build --pattern '*.apk'
              "$adb" install previous-build/*.apk >/dev/null \
                || { echo "Could not install $previous to test updating from it"; exit 1; }
              "$adb" install -r "$APK" \
                || { echo "Android refused to update $previous to this build"; exit 1; }
              echo "PASS: this build installs as an update over $previous"
            else
              "$adb" install "$APK" || { echo "Android refused the signed app"; exit 1; }
            fi
          fi

          before="$(count_logs)"
          "$adb" shell am start -n "$activity" --ez selftest true >/dev/null
          if ! wait_for_logs $((before + 1)) 240; then
            echo "The app did not start for its self-test."
            show_crash
            exit 1
          fi

          # Capture the result rather than stopping here: the app's own log,
          # printed next, is what explains a failure.
          driven=0
          python phone/tools/ci_drive.py "$adb" 480 || driven=$?

          echo "----- what the app wrote to its logs -----"
          "$adb" shell "cat $logs" | tee app-log.txt
          if [ $driven -ne 0 ]; then
            show_crash
          fi
          "$adb" emu kill >/dev/null 2>&1 || true

          [ $driven -eq 0 ] || { echo "The self-test did not finish."; exit 1; }
          if grep -qE "^[0-9:]+  (FAIL  |FAILED while|UNCAUGHT ERROR)|could not be created|stopped accepting" app-log.txt; then
            echo "The app reported a problem; see its log above."
            exit 1
          fi
          grep -q "=== Self-test finished ===" app-log.txt \
            || { echo "The self-test did not reach its end."; exit 1; }

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: IGprepper-android
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error

      - name: Publish it as a pre-release
        if: startsWith(github.ref, 'refs/tags/phone-') && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.sign.outputs.apk }}" \
            --prerelease \
            --title "Phone test build ${GITHUB_REF_NAME#phone-}" \
            --notes "Android test build. Not for general use." \
            || gh release upload "$GITHUB_REF_NAME" "${{ steps.sign.outputs.apk }}" --clobber
