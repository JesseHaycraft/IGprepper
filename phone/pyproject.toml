# The Android test app. Kept apart from the desktop app's pyproject.toml so
# that the desktop dependencies (PySide6) are never pulled into a phone build.

[tool.briefcase]
project_name = "IGprepper"
# Deliberately carries no personal name: the package id is readable by
# anyone who downloads a build.
bundle = "org.igprepper"
version = "0.0.1"
license = "LicenseRef-Proprietary"

[tool.briefcase.app.igprepper]
formal_name = "IGprepper"
# Kept generic, like the bundle: this text is embedded in every build.
description = "IGprepper phone test app"
# The image pipeline is the desktop app's, used unchanged. Bundling the
# whole package also carries its desktop screens along, which are never
# imported here and so never need their desktop-only dependencies.
sources = ["src/igprepper", "../igprep"]
requires = []

[tool.briefcase.app.igprepper.android]
requires = [
    "toga-android~=0.5.0",
    # The newest build in the Android package repository; PyPI's own wheels
    # do not cover Android, and pip must not try to compile it from source.
    "pillow==11.0.0",
]
# MediaStore's Downloads collection, used for the log file, needs Android 10.
min_os_version = "29"

# Toga's Android widgets are built on the Material library. Left unset,
# Briefcase falls back to an old default list that does not include it.
#
# The un-suffixed theme is Material's dark one. Naming it outright, rather
# than a day/night theme, keeps the app dark whatever the phone is set to.
base_theme = "Theme.MaterialComponents"
build_gradle_dependencies = [
    "com.google.android.material:material:1.12.0",
    "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
]
